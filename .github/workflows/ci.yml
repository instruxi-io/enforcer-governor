name: ci
on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: policy engine + plugin self-test
        run: npm test
      - name: manifests are valid JSON
        run: |
          node -e 'JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("hooks/hooks.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("settings.json"))'
      - name: every hook answers on stdout and exits 0
        run: |
          set -e
          export GOVERNOR_HOME=$(mktemp -d)
          for h in pre-tool-use post-tool-use session; do
            echo '{"session_id":"ci","tool_name":"Read","tool_input":{"file_path":"/tmp/a"},"cwd":"/tmp"}' \
              | node hooks/$h.mjs | node -e 'JSON.parse(require("fs").readFileSync(0));'
          done
          node src/report.mjs verify
