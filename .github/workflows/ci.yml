name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: policy engine + plugin self-test
        run: npm test
      - name: manifests are valid JSON
        run: |
          node -e 'JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("hooks/hooks.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("settings.json"))'

      # This repo is not a marketplace: the governor is installed from the
      # Instruxi catalog (instruxi-io/claude-plugins), which pins a tag here and
      # checks that its entries resolve. What stays here is the manifest itself.
      - name: the plugin manifest is sound
        run: |
          node -e '
            const fs = require("fs");
            const fail = m => { console.error("FAIL: " + m); process.exit(1); };
            const own = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            if (own.name !== "enforcer-governor") fail(`plugin.json calls itself ${own.name}`);
            if (fs.existsSync(".claude-plugin/marketplace.json")) fail("this repo must not be a marketplace: a second one named instruxi would shadow the catalog");
            // A plugin cannot declare a status line; Claude Code ignores the
            // field. Catch it here so it never gets added back believing it works.
            if (own.statusLine) fail("statusLine is not a manifest field and is ignored at load");
            console.log("enforcer-governor plugin.json ok");
          '
      - name: every hook answers on stdout and exits 0
        run: |
          set -e
          export GOVERNOR_HOME=$(mktemp -d)
          for h in pre-tool-use post-tool-use session; do
            echo '{"session_id":"ci","tool_name":"Read","tool_input":{"file_path":"/tmp/a"},"cwd":"/tmp"}' \
              | node hooks/$h.mjs | node -e 'JSON.parse(require("fs").readFileSync(0));'
          done
          node src/report.mjs verify
